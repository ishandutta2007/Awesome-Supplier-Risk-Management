<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0c162d" />
      <stop offset="100%" stop-color="#071022" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes nodeGlow {
        0%, 100% { fill-opacity: 0.8; r: 5; }
        50% { fill-opacity: 1; r: 7.5; }
      }

      .radar-pulse-1 { transform-origin: 1020px 180px; animation: pulse 4s ease-in-out infinite; }
      .radar-pulse-2 { transform-origin: 1020px 180px; animation: pulse 4s ease-in-out 2s infinite; }
      .radar-sweep { transform-origin: 1020px 180px; animation: radarRotate 6s linear infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: dashFlow 2s linear infinite; }
      .flow-line-rev { stroke-dasharray: 6 6; animation: dashFlow 3s linear infinite reverse; }
      .floating-group { animation: floatNode 5s ease-in-out infinite; }
      .node-pulse { animation: nodeGlow 2.5s ease-in-out infinite; }
      .node-pulse-delay { animation: nodeGlow 2.5s ease-in-out 1.25s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
  </g>

  <!-- Radar Monitoring Visual (Right Side) -->
  <g id="radar-system">
    <circle cx="1020" cy="180" r="140" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.4" />
    <circle cx="1020" cy="180" r="105" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" />
    <circle cx="1020" cy="180" r="70" fill="none" stroke="#00f2fe" stroke-width="1.5" class="radar-pulse-1" />
    <circle cx="1020" cy="180" r="35" fill="none" stroke="#38ef7d" stroke-width="1.5" class="radar-pulse-2" />
    
    <line x1="880" y1="180" x2="1160" y2="180" stroke="#0369a1" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="1020" y1="40" x2="1020" y2="320" stroke="#0369a1" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

    <g class="radar-sweep">
      <path d="M 1020 180 L 1020 40 A 140 140 0 0 1 1140 110 Z" fill="url(#radarSweep)" />
      <line x1="1020" y1="180" x2="1020" y2="40" stroke="#00f2fe" stroke-width="2" filter="url(#subtleGlow)"/>
    </g>

    <circle cx="1020" cy="180" r="4" fill="#00f2fe" filter="url(#glow)" />
  </g>

  <!-- Multi-Tier Supplier Network Graph -->
  <g class="floating-group">
    <path d="M 940 120 L 1020 180 L 1100 130" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.7"/>
    <path d="M 1020 180 L 1080 250 L 960 240" fill="none" stroke="#34d399" stroke-width="2" class="flow-line-rev" opacity="0.7"/>
    <path d="M 870 180 L 940 120 L 960 240 Z" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>

    <circle cx="1020" cy="180" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
    
    <g>
      <circle cx="940" cy="120" r="7" fill="#10b981" stroke="#34d399" stroke-width="2" filter="url(#subtleGlow)" />
      <circle cx="940" cy="120" r="5" fill="#a7f3d0" class="node-pulse" />
      <text x="925" y="105" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600">Tier-1 Validated</text>
    </g>

    <g>
      <circle cx="1100" cy="130" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
      <circle cx="1100" cy="130" r="5" fill="#e0f2fe" class="node-pulse-delay" />
      <text x="1105" y="118" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="600">Continuous TPRM</text>
    </g>

    <g>
      <circle cx="1080" cy="250" r="7.5" fill="#f59e0b" stroke="#fde68a" stroke-width="2" filter="url(#glow)" />
      <circle cx="1080" cy="250" r="5" fill="#fef3c7" class="node-pulse" />
      <text x="1075" y="275" fill="#fcd34d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="bold">Risk Trigger</text>
    </g>

    <g>
      <circle cx="960" cy="240" r="6" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2" />
      <text x="915" y="260" fill="#ddd6fe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="500">ESG / LkSG</text>
    </g>

    <g>
      <circle cx="870" cy="180" r="5" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="1.5" />
      <text x="815" y="175" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9">Tier-N Mapping</text>
    </g>
  </g>

  <!-- Left Content Branding & Hero Details -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4" fill="#38ef7d" filter="url(#subtleGlow)" />
      <text x="26" y="18" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1">SUPPLIER &amp; TPRM ECOSYSTEM</text>
    </g>

    <g transform="translate(0, 58)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
        Awesome Supplier Risk
      </text>
      <text x="0" y="44" fill="url(#accentGrad)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" filter="url(#subtleGlow)">
        Management &amp; Resilience
      </text>
    </g>

    <text x="0" y="138" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="400" letter-spacing="0.2">
      Curated index of SaaS platforms &amp; open-source architectures for
    </text>
    <text x="0" y="158" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="500">
      Third-Party Risk (TPRM), Cyber Ratings, ESG, Financial Health &amp; SCRM
    </text>

    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="17" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">🛡️ Continuous Risk</text>

      <rect x="140" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="150" y="17" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">🌐 Multi-Tier Graph</text>

      <rect x="290" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="300" y="17" fill="#a78bfa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">⚡ Disruption AI</text>

      <rect x="430" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="440" y="17" fill="#f472b6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">📊 Open-Source</text>
    </g>
  </g>
</svg>
